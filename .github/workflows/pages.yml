name: Deploy plugin index to Pages

# Publishes marketplace/ (index.json + icons/) to GitHub Pages so DSH can add
# https://zhuzhubondbond.github.io/dsh-token-cost-report/index.json as a plugin index.
#
# One-time prerequisite: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'marketplace/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate market index with the official validator
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@0.2.2-rc.1
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { parseMarketIndex } from '@deepseek-ai/dsh-plugin-market-index'
            const url = 'https://zhuzhubondbond.github.io/dsh-token-cost-report/index.json'
            const index = parseMarketIndex(JSON.parse(readFileSync('marketplace/index.json', 'utf8')), url)
            console.log('index format', index.format, '| plugins', index.plugins.length)
            for (const plugin of index.plugins) {
              for (const version of plugin.versions) console.log(plugin.name + '@' + version.version)
            }
          "

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace

      - id: deployment
        uses: actions/deploy-pages@v4
